name: Push alerts (market hours)

# Every 15 minutes, 09:15–15:30 IST Mon–Fri: open-trade stop hits and watchlist price levels.
# Needs secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, VAPID_PRIVATE_KEY.
on:
  schedule:
    - cron: "45,0,15,30 3-9 * * 1-5"   # UTC 03:45–09:30 ≈ 09:15–15:00 IST (GitHub may delay a few minutes)
    - cron: "45 9 * * 1-5"             # ~15:15 IST
  workflow_dispatch:

concurrency:
  group: push-alerts
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: https://guardian-swart-theta.vercel.app
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: Send stop / level alerts
        run: node scripts/push-alerts.mjs
